<svg width="58" height="62" viewBox="0 0 58 62" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .goose-foot {
    transform-box: fill-box;
    transform-origin: center;
  }

  .goose-foot--front {
    animation: goose-foot-front 0.22s ease-in-out infinite alternate;
  }

  .goose-foot--back {
    animation: goose-foot-back 0.22s ease-in-out infinite alternate;
  }

  .goose-wing {
    transform-box: fill-box;
    transform-origin: left center;
    animation: goose-wing-run 0.22s ease-in-out infinite alternate;
  }

  @keyframes goose-foot-front {
    from { transform: translateX(-1px) translateY(0) rotate(-5deg); }
    to { transform: translateX(2px) translateY(-2px) rotate(7deg); }
  }

  @keyframes goose-foot-back {
    from { transform: translateX(2px) translateY(-2px) rotate(7deg); }
    to { transform: translateX(-1px) translateY(0) rotate(-5deg); }
  }

  @keyframes goose-wing-run {
    from { transform: rotate(-3deg); }
    to { transform: rotate(6deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .goose-foot,
    .goose-wing {
      animation: none;
    }
  }
</style>
